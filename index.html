<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mathieu Boutinon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: texte aligné à gauche, démo spectrale comme pièce centrale, sections sobres séparées par des filets. */
:root{
  --bg:#F3F7F7; --surface:#FFFFFF; --fg:#0E1A22; --muted:#46565F; --line:#D3DDE1;
  --accent:#0A6F68; --accent-fg:#FFFFFF; --accent-soft:#DDF0EE;
  --c1:#0A6F68; --c2:#B05F00; --c3:#B83A0A;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1318; --surface:#111C23; --fg:#E6EEF1; --muted:#9DB0BA; --line:#22343E;
    --accent:#46C9BC; --accent-fg:#04211E; --accent-soft:#12302F;
    --c1:#46C9BC; --c2:#F0B04A; --c3:#FF8F6B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1318; --surface:#111C23; --fg:#E6EEF1; --muted:#9DB0BA; --line:#22343E;
  --accent:#46C9BC; --accent-fg:#04211E; --accent-soft:#12302F;
  --c1:#46C9BC; --c2:#F0B04A; --c3:#FF8F6B; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;padding-inline:clamp(16px,4vw,48px);padding-block:0 48px}
.wrap{max-width:1120px;margin-inline:auto}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.01em}
h3{font-size:1.15rem}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

header.top{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center;padding-block:20px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.15rem;color:var(--fg);text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:center}
nav a{color:var(--muted);text-decoration:none;font-size:.95rem;padding-block:4px}
nav a:hover{color:var(--fg)}
.lang{display:flex;gap:4px;margin-left:8px}
.lang button{font:inherit;font-family:var(--font-mono);font-size:.8rem;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.hero{padding-block:48px 56px;display:flex;flex-direction:column;gap:24px;align-items:flex-start}
.hero h1{font-size:clamp(2.3rem,6.4vw,4.4rem);letter-spacing:-.025em;max-width:16ch}
.lead{font-size:clamp(1.05rem,2vw,1.25rem);max-width:56ch;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;background:var(--accent-soft);color:var(--fg);padding:6px 12px;border-radius:999px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{font:inherit;font-weight:500;padding:10px 18px;border-radius:6px;border:1px solid var(--accent);text-decoration:none;cursor:pointer;display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--accent)}

section{border-top:1px solid var(--line);padding-block:48px;display:flex;flex-direction:column;gap:28px}
.intro{max-width:62ch;color:var(--muted)}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.step{border-top:2px solid var(--fg);padding-top:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.step .mono{color:var(--muted);font-size:.85rem}

.demo{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.demo{grid-template-columns:minmax(0,1fr)}}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0}
.chartbox svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);padding:8px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.panel{display:flex;flex-direction:column;gap:18px;min-width:0}
.ctrl{display:flex;flex-direction:column;gap:6px}
.ctrl .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
input[type=range]{width:100%;accent-color:var(--accent)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:.8rem}
.note{font-size:.88rem;color:var(--muted);max-width:60ch}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{color:var(--muted);font-size:.96rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tags span{font-family:var(--font-mono);font-size:.74rem;border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--muted)}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.skills div{display:flex;flex-direction:column;gap:6px;min-width:0}
.skills p{color:var(--muted)}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;padding-block:14px;border-bottom:1px solid var(--line)}
.timeline .mono{color:var(--muted);font-size:.9rem}
@media (max-width:520px){.timeline li{grid-template-columns:minmax(0,1fr);gap:2px}}

.contact{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.mail{font-family:var(--font-mono);font-size:1.1rem;word-break:break-all;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;user-select:all}
.status{min-height:1.4em;color:var(--muted);font-size:.9rem}
footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.path{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0;text-decoration:none;color:var(--fg);transition:border-color .15s}
.path:hover{border-color:var(--accent)}
.path h2{font-size:1.6rem}
.path p{color:var(--muted)}
.path .go{margin-top:auto;color:var(--accent);font-weight:500}
.path .tags{margin-top:0}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;color:var(--muted);font-size:.95rem}
.hubhero{padding-block:56px 40px}
footer a{color:var(--muted)}

/* Signature : trois bandes spectrales (teal, ambre, vermillon) reprises partout */
.bandline{height:4px;width:96px;border-radius:2px;background:linear-gradient(90deg,var(--c1) 0 33.3%,var(--c2) 33.3% 66.6%,var(--c3) 66.6%)}
.hero2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:48px 56px}
@media (max-width:900px){.hero2{grid-template-columns:minmax(0,1fr)}}
.hero2 .txt{display:flex;flex-direction:column;gap:22px;align-items:flex-start;min-width:0}
.hero2 h1{font-size:clamp(2.4rem,6vw,4.2rem);letter-spacing:-.03em}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption,.figcap{font-size:.85rem;color:var(--muted);padding:10px 4px 0}
.fig text,svg text{font-family:var(--font-body)}
.t-muted{fill:var(--muted)}.t-fg{fill:var(--fg)}.t-mono{font-family:var(--font-mono)}
.proof{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;border-block:1px solid var(--line);padding-block:0}
.proof div{padding:22px 20px 22px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.proof .num{font-family:var(--font-display);font-weight:700;font-size:clamp(2rem,4.6vw,3rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.proof .n1{color:var(--c1)}.proof .n2{color:var(--c2)}.proof .n3{color:var(--c3)}
.proof small{color:var(--muted);font-size:.9rem;line-height:1.4}
section.proofsec{padding-block:0;border-top:none}
.path.dev{border-top:4px solid var(--c1)}.path.pm{border-top:4px solid var(--c2)}
.path .mini{margin-block:2px}
.figs{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.out{font-family:var(--font-mono);font-size:.78rem;color:var(--muted);margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.step .out{margin-top:6px}
.legend2{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);padding:8px 4px 0}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:no-preference){
 .draw path.band{stroke-dasharray:900;stroke-dashoffset:900;animation:dr 1.6s ease-out forwards}
 .draw path.b2{animation-delay:.25s}.draw path.b3{animation-delay:.5s}.draw path.sum{animation-delay:.8s}
 @keyframes dr{to{stroke-dashoffset:0}}
}

/* ===== Ergonomie et accessibilité ===== */
html{scroll-behavior:smooth}
body{font-size:1rem}
.skip{position:absolute;left:12px;top:-60px;background:var(--accent);color:var(--accent-fg);padding:10px 16px;border-radius:6px;z-index:100;text-decoration:none;font-weight:500}
.skip:focus{top:12px}
header.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px;margin-bottom:0}
header.top .dock{position:static}
section[id],main[id],.hero2,.hero{scroll-margin-top:84px}
.dockbtn{font:inherit;font-size:.9rem;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:0 12px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.dockbtn:hover{border-color:var(--accent)}
.dockbtn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.dockbtn svg{width:16px;height:16px;flex:none}
.panel2{position:fixed;right:max(16px,2vw);top:calc(var(--hh,64px) + 6px);width:min(calc(100vw - 32px),360px);max-height:calc(100vh - var(--hh,64px) - 22px);overflow:auto;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:16px;z-index:40}
.panel2[hidden]{display:none}
.panel2 h2{font-size:1.05rem;margin-bottom:10px}
.panel2 ol,.panel2 ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.panel2 a.tl{display:flex;align-items:center;gap:10px;padding:10px 8px;min-height:44px;color:var(--fg);text-decoration:none;border-radius:6px}
.panel2 a.tl:hover{background:var(--accent-soft)}
.panel2 a.tl[aria-current="true"]{background:var(--accent-soft);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.panel2 .sep{border-top:1px solid var(--line);margin-block:8px}
.panel2 .sub{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 8px 2px}
.opt{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-bottom:1px solid var(--line)}
.opt:last-of-type{border-bottom:none}
.opt>span{font-weight:600;font-size:.95rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.tog{font:inherit;font-size:.9rem;min-height:40px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"],.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.reset{margin-top:10px}
.progress{position:fixed;left:0;top:0;height:3px;width:0;z-index:60;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3))}
.totop{position:fixed;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;z-index:35;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.totop.show{opacity:1;pointer-events:auto}
.totop svg{width:20px;height:20px}
footer a{text-decoration:underline;text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
/* préférences */
html[data-font="readable"]{--font-body:"Atkinson Hyperlegible","Verdana",sans-serif;--font-display:"Atkinson Hyperlegible","Verdana",sans-serif}
html[data-space] body{line-height:1.9;letter-spacing:.03em;word-spacing:.1em}
html[data-space] p{max-width:62ch}
html[data-motion],html[data-motion] *{scroll-behavior:auto!important;animation:none!important;transition:none!important}
html[data-motion] .draw path.band{stroke-dasharray:none!important;stroke-dashoffset:0!important}
html[data-theme="light"]{color-scheme:light}

html[data-font="lexend"]{--font-body:"Lexend","Verdana",sans-serif;--font-display:"Lexend","Verdana",sans-serif}
html[data-space="on"] body{line-height:1.9;letter-spacing:.04em;word-spacing:.12em}
html[data-tint]{--fg:#1A1A1A;--muted:#3A3A3A;--accent:#0A5F59;--accent-fg:#FFFFFF;--c1:#0A5F59;--c2:#8A4B00;--c3:#A33100}
html[data-tint="cream"]{--bg:#FAF1D8;--surface:#FFF9E8;--line:#D4C59A;--accent-soft:#F1E3BC}
html[data-tint="blue"]{--bg:#E3EEF8;--surface:#F3F8FD;--line:#B3C8DD;--accent-soft:#D2E4F3}
html[data-tint="green"]{--bg:#E2F1E4;--surface:#F2F9F3;--line:#B2D0B7;--accent-soft:#CFE7D3}
html[data-tint] .hero2 h1,html[data-tint] h1{color:#111}
html[data-calm] p,html[data-calm] li,html[data-calm] .lead{text-align:left;max-width:60ch}
html[data-calm] *{font-style:normal!important}
html[data-calm] .label,html[data-calm] .sub,html[data-calm] th,html[data-calm] .out{text-transform:none!important;letter-spacing:.02em!important}
.ruler{position:fixed;left:0;right:0;top:40%;height:56px;box-shadow:0 0 0 100vmax rgba(0,0,0,.38);border-block:2px solid var(--accent);pointer-events:none;z-index:50}
.ruler[hidden]{display:none}
.brief{display:none;background:var(--accent-soft);border-left:5px solid var(--accent);border-radius:6px;padding:20px 24px;margin-block:8px 24px}
.brief h2{font-size:1.15rem;margin-bottom:10px}
.brief ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
html[data-simple] .brief{display:block}
.help{display:none;color:var(--fg);font-size:.95rem;font-weight:600}
html[data-nums] .help{display:block}
.panel2 .hint{font-size:.85rem;color:var(--muted);margin:0 0 6px}
.opt.row{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.opt.row .tog{flex:none;min-width:96px}
html[data-big] a.btn,html[data-big] .btn,html[data-big] .dockbtn,html[data-big] .seg button,html[data-big] .tog,html[data-big] nav a,html[data-big] .panel2 a.tl,html[data-big] .lang button{min-height:52px;min-width:52px;padding-inline:18px}
html[data-big] nav{gap:8px 16px}
html[data-big] input[type=range]{height:44px}
html[data-big] input[type=range]::-webkit-slider-thumb{width:30px;height:30px}
html[data-big] input[type=range]::-moz-range-thumb{width:30px;height:30px}
html[data-big] .card,html[data-big] .path{padding:28px}
html[data-focus] .bandline,html[data-focus] .progress,html[data-focus] .chip,html[data-focus] .facts,html[data-focus] .tags,html[data-focus] .totop{display:none!important}
html[data-focus] .draw path.band{animation:none!important;stroke-dasharray:none!important;stroke-dashoffset:0!important}
section.dim{opacity:.4;transition:opacity .25s}
section.dim:focus-within,section.dim:hover{opacity:1}
html[data-motion] section.dim{transition:none}
html[data-contrast="high"]{--bg:#FFFFFF;--surface:#FFFFFF;--fg:#000000;--muted:#1A1A1A;--line:#000000;--accent:#00423D;--accent-fg:#FFFFFF;--accent-soft:#E3F3F1;--c1:#00423D;--c2:#6B3500;--c3:#8A2000}
html[data-contrast="high"] .card,html[data-contrast="high"] .path,html[data-contrast="high"] .fig,html[data-contrast="high"] .chartbox{border-width:2px}
html[data-contrast="high"] a{text-decoration:underline}
@media (prefers-color-scheme:dark){html[data-contrast="high"]:not([data-theme="light"]){--bg:#000000;--surface:#000000;--fg:#FFFFFF;--muted:#F0F0F0;--line:#FFFFFF;--accent:#7DF0E4;--accent-fg:#000000;--accent-soft:#0B2E2B;--c1:#7DF0E4;--c2:#FFC857;--c3:#FF9E80}}
html[data-contrast="high"][data-theme="dark"]{--bg:#000000;--surface:#000000;--fg:#FFFFFF;--muted:#F0F0F0;--line:#FFFFFF;--accent:#7DF0E4;--accent-fg:#000000;--accent-soft:#0B2E2B;--c1:#7DF0E4;--c2:#FFC857;--c3:#FF9E80}
@media print{
  .dockwrap,.progress,.totop,.skip,.ruler,.panel2{display:none!important}
  :root{--bg:#fff;--surface:#fff;--fg:#000;--muted:#333;--line:#999}
  body{background:#fff;color:#000;padding-inline:0}
  header.top{position:static;border:none}
  section{break-inside:avoid}
  .draw path.band{stroke-dasharray:none!important;stroke-dashoffset:0!important;animation:none!important}
}
@media (max-width:640px){header.top nav>a{display:none}header.top{gap:8px 12px}.dockbtn .lbl{display:none}.dockbtn{padding:0 10px}}
</style>

<body>
<div class="wrap">
<header class="top">
  <a class="brand" href="index.html">Mathieu Boutinon</a>
  <nav aria-label="Navigation">
    <a href="developpement.html" data-i18n="nav_dev"></a>
    <a href="projet.html" data-i18n="nav_pm"></a>
    <a href="#contact" data-i18n="nav_contact"></a>
    <span class="lang" role="group" aria-label="Langue / Language">
      <button type="button" id="lang-fr" aria-pressed="true">FR</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
    </span>
  </nav>
</header>

<main id="top">
