<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mathieu Boutinon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Shippori+Mincho+B1:wght@700;800&display=swap">
<style>
/* Layout: texte aligné à gauche, démo spectrale comme pièce centrale, sections sobres séparées par des filets. */
:root{
  --bg:#F3F7F7; --surface:#FFFFFF; --fg:#0E1A22; --muted:#46565F; --line:#D3DDE1;
  --accent:#0A6F68; --accent-fg:#FFFFFF; --accent-soft:#DDF0EE;
  --c1:#0A6F68; --c2:#B05F00; --c3:#B83A0A;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1318; --surface:#111C23; --fg:#E6EEF1; --muted:#9DB0BA; --line:#22343E;
    --accent:#46C9BC; --accent-fg:#04211E; --accent-soft:#12302F;
    --c1:#46C9BC; --c2:#F0B04A; --c3:#FF8F6B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1318; --surface:#111C23; --fg:#E6EEF1; --muted:#9DB0BA; --line:#22343E;
  --accent:#46C9BC; --accent-fg:#04211E; --accent-soft:#12302F;
  --c1:#46C9BC; --c2:#F0B04A; --c3:#FF8F6B; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;padding-inline:clamp(16px,4vw,48px);padding-block:0 48px}
.wrap{max-width:1120px;margin-inline:auto}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.01em}
h3{font-size:1.15rem}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

header.top{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center;padding-block:20px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.15rem;color:var(--fg);text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:center}
nav a{color:var(--muted);text-decoration:none;font-size:.95rem;padding-block:4px}
nav a:hover{color:var(--fg)}
.lang{display:flex;gap:4px;margin-left:8px}
.lang button{font:inherit;font-family:var(--font-mono);font-size:.8rem;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.hero{padding-block:48px 56px;display:flex;flex-direction:column;gap:24px;align-items:flex-start}
.hero h1{font-size:clamp(2.3rem,6.4vw,4.4rem);letter-spacing:-.025em;max-width:16ch}
.lead{font-size:clamp(1.05rem,2vw,1.25rem);max-width:56ch;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;background:var(--accent-soft);color:var(--fg);padding:6px 12px;border-radius:999px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{font:inherit;font-weight:500;padding:10px 18px;border-radius:6px;border:1px solid var(--accent);text-decoration:none;cursor:pointer;display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--accent)}

section{border-top:1px solid var(--line);padding-block:48px;display:flex;flex-direction:column;gap:28px}
.intro{max-width:62ch;color:var(--muted)}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.step{border-top:2px solid var(--fg);padding-top:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.step .mono{color:var(--muted);font-size:.85rem}

.demo{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.demo{grid-template-columns:minmax(0,1fr)}}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0}
.chartbox svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);padding:8px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.panel{display:flex;flex-direction:column;gap:18px;min-width:0}
.ctrl{display:flex;flex-direction:column;gap:6px}
.ctrl .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
input[type=range]{width:100%;accent-color:var(--accent)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:.8rem}
.note{font-size:.88rem;color:var(--muted);max-width:60ch}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{color:var(--muted);font-size:.96rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tags span{font-family:var(--font-mono);font-size:.74rem;border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--muted)}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.skills div{display:flex;flex-direction:column;gap:6px;min-width:0}
.skills p{color:var(--muted)}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;padding-block:14px;border-bottom:1px solid var(--line)}
.timeline .mono{color:var(--muted);font-size:.9rem}
@media (max-width:520px){.timeline li{grid-template-columns:minmax(0,1fr);gap:2px}}

.contact{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.mail{font-family:var(--font-mono);font-size:1.1rem;word-break:break-all;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;user-select:all}
.status{min-height:1.4em;color:var(--muted);font-size:.9rem}
footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.path{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0;text-decoration:none;color:var(--fg);transition:border-color .15s}
.path:hover{border-color:var(--accent)}
.path h2{font-size:1.6rem}
.path p{color:var(--muted)}
.path .go{margin-top:auto;color:var(--accent);font-weight:500}
.path .tags{margin-top:0}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;color:var(--muted);font-size:.95rem}
.hubhero{padding-block:56px 40px}
footer a{color:var(--muted)}

/* Signature : trois bandes spectrales (teal, ambre, vermillon) reprises partout */
.bandline{height:4px;width:96px;border-radius:2px;background:linear-gradient(90deg,var(--c1) 0 33.3%,var(--c2) 33.3% 66.6%,var(--c3) 66.6%)}
.hero2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:48px 56px}
@media (max-width:900px){.hero2{grid-template-columns:minmax(0,1fr)}}
.hero2 .txt{display:flex;flex-direction:column;gap:22px;align-items:flex-start;min-width:0}
.hero2 h1{font-size:clamp(2.4rem,6vw,4.2rem);letter-spacing:-.03em}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption,.figcap{font-size:.85rem;color:var(--muted);padding:10px 4px 0}
.fig text,svg text{font-family:var(--font-body)}
.t-muted{fill:var(--muted)}.t-fg{fill:var(--fg)}.t-mono{font-family:var(--font-mono)}
.proof{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;border-block:1px solid var(--line);padding-block:0}
.proof div{padding:22px 20px 22px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.proof .num{font-family:var(--font-display);font-weight:700;font-size:clamp(2rem,4.6vw,3rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.proof .n1{color:var(--c1)}.proof .n2{color:var(--c2)}.proof .n3{color:var(--c3)}
.proof small{color:var(--muted);font-size:.9rem;line-height:1.4}
section.proofsec{padding-block:0;border-top:none}
.path.dev{border-top:4px solid var(--c1)}.path.pm{border-top:4px solid var(--c2)}
.path .mini{margin-block:2px}
.figs{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.out{font-family:var(--font-mono);font-size:.78rem;color:var(--muted);margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.step .out{margin-top:6px}
.legend2{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);padding:8px 4px 0}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:no-preference){
 .draw path.band{stroke-dasharray:900;stroke-dashoffset:900;animation:dr 1.6s ease-out forwards}
 .draw path.b2{animation-delay:.25s}.draw path.b3{animation-delay:.5s}.draw path.sum{animation-delay:.8s}
 @keyframes dr{to{stroke-dashoffset:0}}
}

/* ===== Identité : feuille de mesure d'ingénieur (papier millimétré, encre marine, trois bandes) ===== */
:root{
  --bg:#F2F5FB; --surface:#FFFFFF; --fg:#0E1B3D; --muted:#44506E; --line:#C5CDE0; --grid:rgba(35,56,216,.075);
  --accent:#2338D8; --accent-fg:#FFFFFF; --accent-soft:#E1E6FB;
  --c1:#2338D8; --c2:#E5490B; --c3:#0B8A62;
  --font-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --font-body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;
  --font-mono:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1230; --surface:#101C48; --fg:#E8EDFF; --muted:#AAB6DD; --line:#2B3B7A; --grid:rgba(142,162,255,.09);
  --accent:#8EA2FF; --accent-fg:#0A1230; --accent-soft:#17265E; --c1:#8EA2FF; --c2:#FF8A4C; --c3:#3DD6A7;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1230; --surface:#101C48; --fg:#E8EDFF; --muted:#AAB6DD; --line:#2B3B7A; --grid:rgba(142,162,255,.09);
  --accent:#8EA2FF; --accent-fg:#0A1230; --accent-soft:#17265E; --c1:#8EA2FF; --c2:#FF8A4C; --c3:#3DD6A7;color-scheme:dark}
body{font-family:var(--font-body);font-size:1.0625rem;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-position:-1px -1px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.005em;line-height:.95}
h1{font-size:clamp(3.4rem,11vw,9rem);letter-spacing:-.005em}
h2{font-size:clamp(2rem,4.4vw,3.2rem)}
h3{font-size:1.45rem;line-height:1.05}
.lead{font-size:clamp(1.15rem,2.2vw,1.45rem);line-height:1.5;color:var(--fg);max-width:34em}
.label{font-family:var(--font-body);font-size:1rem;font-weight:700;letter-spacing:0;text-transform:none;color:var(--fg)}
.mono{font-variant-numeric:tabular-nums}
/* en-tête */
header.top{border-bottom:3px solid var(--fg)}
.brand{display:inline-flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:800;font-size:1.5rem;text-transform:uppercase;letter-spacing:.02em}
.brand::before{content:"";width:22px;height:22px;background:linear-gradient(var(--c1) 0 30%,transparent 30% 35%,var(--c2) 35% 65%,transparent 65% 70%,var(--c3) 70%);display:inline-block}
nav a{font-weight:600;color:var(--fg);text-decoration:none;border-bottom:2px solid transparent}
nav a:hover{border-bottom-color:var(--c2)}
.lang button,.dockbtn,.seg button,.tog,.btn,.panel2,.chartbox,.card,.fig,.chip,.mail,.brief,.path,.totop{border-radius:0}
.lang button{color:var(--fg);border:2px solid var(--fg);font-family:var(--font-body);font-weight:700}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn{border:2px solid var(--fg);font-weight:700;color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn:hover{background:var(--c2);border-color:var(--c2);color:#fff}
.chip{background:transparent;border:2px solid var(--fg);padding:6px 14px;font-weight:600}
.chip i{border-radius:0;background:var(--c2)}
.bandline{height:10px;width:132px;border-radius:0}
/* sections : titre à gauche, contenu à droite */
section{border-top:3px solid var(--fg);padding-block:44px 64px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
@media (min-width:980px){
  section{grid-template-columns:minmax(190px,.26fr) minmax(0,1fr);column-gap:48px}
  section>h2,section>p.label{grid-column:1}
  section>*:not(h2):not(p.label){grid-column:2}
  section>p.label{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:clamp(2rem,3vw,2.6rem);line-height:.95}
}
section.proofsec{border-top:3px solid var(--fg);padding-block:44px 64px}
body header.top{border-bottom:3px solid var(--fg)}
.intro{color:var(--muted);max-width:56ch}
/* fiches */
.card{background:var(--surface);border:2px solid var(--fg);padding:22px}
.card h3{padding-bottom:10px;border-bottom:2px solid var(--c2);margin-bottom:2px}
.cards{gap:18px}
.tags span{border:none;border-radius:0;background:var(--accent-soft);color:var(--fg);font-family:var(--font-body);font-weight:600;font-size:.82rem;padding:2px 9px}
.steps{gap:0;border:2px solid var(--fg);background:var(--surface)}
.steps{gap:2px;background:var(--fg)}
.step{border-top:none;padding:20px;background:var(--surface)}
.steps:has(>:nth-child(4)){grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.steps:has(>:nth-child(4)){grid-template-columns:minmax(0,1fr)}}
.step .mono{font-family:var(--font-display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--c2)}
.out{font-family:var(--font-body);font-size:.85rem;border-top:2px solid var(--line)}
.skills{gap:0;border-top:2px solid var(--fg)}
.skills>div{padding:16px 20px 16px 0;border-bottom:2px solid var(--line)}
.timeline li{grid-template-columns:150px minmax(0,1fr);border-bottom:2px solid var(--line)}
.timeline .mono{font-family:var(--font-display);font-weight:800;font-size:1.35rem;color:var(--fg)}
.chartbox,.fig{background:var(--surface);border:2px solid var(--fg);padding:14px}
.legend,.legend2{color:var(--fg)}
table{font-size:.95rem}th,td{border-bottom:2px solid var(--line)}
th{color:var(--fg);font-weight:700}
.mail{background:var(--surface);border:2px solid var(--fg);font-family:var(--font-display);font-weight:800;font-size:clamp(1.05rem,5vw,2.4rem);letter-spacing:.01em;padding:12px 18px}
footer{border-top:3px solid var(--fg);color:var(--fg)}
/* chiffres */
.proof{border-block:none;gap:16px 24px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.proof div{padding:6px 24px 6px 0}
.proof .num{font-family:var(--font-display);font-weight:800;font-size:clamp(2.8rem,5vw,4.2rem);line-height:.9;color:var(--fg);letter-spacing:0;white-space:nowrap}
.proof .n1,.proof .n2,.proof .n3{color:var(--fg)}
.proof div:first-child .num{color:var(--c2)}
.proof small{color:var(--muted);font-size:.95rem}
/* accueil */
.hubtop{padding-block:44px 28px;display:flex;flex-direction:column;gap:24px;align-items:flex-start}
.hubtop h1{max-width:9ch}
.sheet{margin:0;background:var(--surface);border:2px solid var(--fg);display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,310px);grid-template-areas:"chart block" "cap block"}
.sheet .chartwrap{grid-area:chart;padding:14px 14px 0;min-width:0}
.sheet .chartwrap{overflow-x:auto}
.sheet svg{display:block;width:100%;min-width:620px;height:auto}
.sheet figcaption{grid-area:cap;padding:14px 18px;font-size:.95rem;color:var(--muted);align-self:end;border-top:2px solid var(--fg)}
.block{grid-area:block;border-left:2px solid var(--fg);margin:0;font-size:.92rem;display:flex;flex-direction:column;justify-content:flex-end}
.block dl{display:grid;grid-template-columns:auto 1fr;grid-auto-rows:1fr;margin:0;flex:1}
.block dt,.block dd{margin:0;padding:6px 10px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.block dt{font-weight:700;border-right:1px solid var(--line)}
.block dl>*:nth-last-child(-n+2){border-bottom:none}
@media (max-width:860px){.sheet{grid-template-columns:minmax(0,1fr);grid-template-areas:"chart" "cap" "block"}.block{border-left:none;border-top:2px solid var(--fg)}}
.paths{gap:0;border:2px solid var(--fg);align-items:stretch}
.path{border:none;border-radius:0;padding:32px;min-height:280px;gap:16px}
.path.dev{background:var(--c1);color:var(--accent-fg);border-top:none}
.path.pm{background:var(--c2);color:#14100C;border-top:none}
html[data-theme="dark"] .path.pm,html:not([data-theme="light"]) .path.pm{color:#14100C}
.path h2{font-size:clamp(1.7rem,3vw,2.7rem);overflow-wrap:anywhere}
.path p{color:inherit;max-width:30em}
.path .tags span{background:transparent;border:2px solid currentColor;color:inherit}
.path .go{border-top:2px solid currentColor;padding-top:12px;color:inherit;font-weight:700;margin-top:auto}
.path:hover{filter:brightness(1.07);border-color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .path.dev{color:#0A1230}}
/* lisibilité : désactiver le décor quand une aide est active */
html[data-tint] body,html[data-contrast] body,html[data-calm] body,html[data-focus] body,html[data-font] body,html[data-space] body{background-image:none}
html[data-font] h1,html[data-font] h2,html[data-font] h3,html[data-calm] h1,html[data-calm] h2,html[data-calm] h3,html[data-space] h1,html[data-space] h2,html[data-space] h3,html[data-big] .brand,html[data-font] .brand{text-transform:none;letter-spacing:0;line-height:1.1}
html[data-font] .proof .num,html[data-calm] .proof .num{line-height:1.1}
header.top .panel2{border:2px solid var(--fg);border-radius:0;box-shadow:none}
header.top .dockbtn{border:2px solid var(--fg);border-radius:0;font-weight:600}
header.top .panel2 .seg button,header.top .panel2 .tog{border:2px solid var(--fg);border-radius:0;font-weight:600}
body .totop{border-radius:0}
header.top .panel2 a.tl{border-radius:0}
.panel2 h2{font-size:1.4rem}
@media (min-width:980px){.proof{grid-template-columns:repeat(2,minmax(0,1fr))}
  section{grid-template-columns:minmax(220px,.3fr) minmax(0,1fr)}
  section>h2,section>p.label{font-size:clamp(1.7rem,2.4vw,2.3rem);overflow-wrap:anywhere;hyphens:auto;min-width:0}}
section>h2,section>p.label{min-width:0}
.cards:has(>:nth-child(4)){grid-template-columns:repeat(2,minmax(0,1fr))}
